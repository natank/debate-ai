[project]
name = "debate-ai"
version = "0.1.0"
description = "Agentic debate app: two debaters and a judge"
requires-python = ">=3.10,<3.14"
dependencies = ["crewai"]

[project.scripts]
debate = "debate_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_ai"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
