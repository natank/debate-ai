propose:
  description: >
    You are proposing the motion: {motion}.
    Come up with a clear argument in favor of the motion.
    Be very convincing.
  expected_output: >
    Your clear argument in favor of the motion, in a concise manner.
    Plain text, about 200 to 300 words.
  agent: debater

oppose:
  description: >
    You are in opposition to the motion: {motion}.
    Come up with a clear argument against the motion.
    Be very convincing.
  expected_output: >
    Your clear argument against the motion, in a concise manner.
    Plain text, about 200 to 300 words.
  agent: debater

decide:
  description: >
    Review the arguments presented by the debaters and decide which side is more convincing.
    Answer with the winner, "for" or "against", and your reasoning, which must refer
    to specific points made in the arguments.
  expected_output: >
    A JSON object with "winner" ("for" or "against") and "reasoning" (at least 50 words).
  agent: judge
